<!-- Dieselbe Marke wie das Favicon, aber randlos und ohne runde Ecken.

     Für zwei Zwecke: das apple-touch-icon (iOS legt seine eigene Maske darüber
     und schneidet mitgelieferte Rundungen doppelt) und das „maskable"-Icon
     unter Android (die Ecken können jede Form annehmen, deshalb muss die
     Fläche bis zum Rand tragen).

     Die Stufen liegen zwischen 14 und 50 von 64 — das sind 56 % der Kante, ihre
     Ecken 25.5 von 32 Einheiten vom Mittelpunkt entfernt. Damit bleiben sie
     innerhalb der 80 %-Sicherheitszone, die eine runde Maske übrig lässt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- `userSpaceOnUse` ist hier keine Feinheit, sondern der Unterschied
         zwischen einer Skala und vier Farbklecksen: Ohne die Angabe rechnet SVG
         den Verlauf je Form aus, und jeder einzelne Balken trüge den ganzen
         Regenbogen. Die Koordinaten laufen deshalb durch den Zeichenraum — von
         der Unterkante des untersten Balkens bis zur Oberkante des obersten. -->
    <linearGradient id="s" gradientUnits="userSpaceOnUse" x1="0" y1="49" x2="0" y2="14">
      <stop offset="0" stop-color="#c8324a" />
      <stop offset="0.32" stop-color="#e08a2a" />
      <stop offset="0.5" stop-color="#f0d64a" />
      <stop offset="0.7" stop-color="#3fbf9a" />
      <stop offset="1" stop-color="#9b6cf0" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#0b0713" />
  <g fill="url(#s)">
    <rect x="14" y="44" width="36" height="5" rx="2.5" />
    <rect x="17" y="34" width="30" height="5" rx="2.5" />
    <rect x="20" y="24" width="24" height="5" rx="2.5" />
    <rect x="24" y="14" width="16" height="5" rx="2.5" />
  </g>
</svg>
